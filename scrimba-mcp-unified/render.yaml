services:
  - type: web
    name: scrimba-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MCP_API_KEY
        value: scrimba-teaching-secure-key-2024
      - key: PYTHON_VERSION
        value: 3.11