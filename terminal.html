<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #3e3e3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            font-size: 16px;
            font-weight: 500;
            color: #569cd6;
        }

        #status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3333;
        }

        #status-dot.connected {
            background: #4ec9b0;
        }

        #terminal {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }

        .entry {
            margin-bottom: 20px;
        }

        .prompt-line {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .prompt-symbol {
            color: #4ec9b0;
            margin-right: 8px;
            user-select: none;
        }

        .user-input {
            color: #d4d4d4;
            flex: 1;
            word-break: break-word;
        }

        .response {
            margin-left: 20px;
            color: #c0c0c0;
            white-space: pre-wrap;
            font-family: inherit;
        }
        
        .tool-use {
            background: #2a2d3a;
            border-left: 3px solid #569cd6;
            padding: 8px;
            margin: 8px 0 8px 20px;
            border-radius: 4px;
        }
        
        .tool-name {
            color: #4ec9b0;
            font-weight: bold;
        }
        
        .tool-input {
            color: #9cdcfe;
            margin-top: 4px;
            font-size: 12px;
        }
        
        .tool-result {
            color: #808080;
            margin-left: 20px;
            font-style: italic;
        }

        .response.error {
            color: #f48771;
        }

        .response.thinking {
            color: #808080;
            font-style: italic;
        }

        #input-container {
            background: #2d2d2d;
            border-top: 1px solid #3e3e3e;
            padding: 15px 20px;
            display: flex;
            align-items: flex-start;
        }

        #input-prompt {
            color: #4ec9b0;
            margin-right: 8px;
            user-select: none;
            padding-top: 2px;
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            color: #d4d4d4;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 20px;
            line-height: 1.4;
        }

        #controls {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:disabled {
            background: #3e3e3e;
            color: #808080;
            cursor: not-allowed;
        }

        button.secondary {
            background: #3e3e3e;
        }

        button.secondary:hover {
            background: #4e4e4e;
        }

        .code-block {
            background: #282828;
            border: 1px solid #3e3e3e;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            overflow-x: auto;
        }

        .working-dir {
            font-size: 11px;
            color: #808080;
            margin-left: 10px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e3e;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Claude Code Terminal</h1>
        <div id="status">
            <span id="status-dot"></span>
            <span id="status-text">Disconnected</span>
            <span class="working-dir" id="working-dir"></span>
        </div>
    </div>

    <div id="terminal"></div>

    <div id="input-container">
        <span id="input-prompt">❯</span>
        <textarea id="input" placeholder="Enter a command or ask Claude Code to help..." autofocus></textarea>
        <div id="controls">
            <button id="send-btn" onclick="sendCommand()">Send</button>
            <button class="secondary" onclick="clearTerminal()">Clear</button>
        </div>
    </div>

    <script>
        // MCP Server configuration
        const MCP_URL = 'http://127.0.0.1:8001/mcp';  // Using CORS proxy
        let sessionId = null;
        let isConnected = false;
        let workingDir = null;

        // Initialize on page load
        window.onload = async function() {
            await connectToServer();
            updateWorkingDir();
        };

        // Connect to MCP server
        async function connectToServer() {
            try {
                updateStatus('Connecting...', false);
                
                // Initialize session
                const response = await fetch(MCP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json, text/event-stream'
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'initialize',
                        params: {
                            protocolVersion: '2024-11-05',
                            capabilities: {},
                            clientInfo: {
                                name: 'claude-code-terminal',
                                version: '1.0.0'
                            }
                        }
                    })
                });

                // Get session ID from headers
                sessionId = response.headers.get('mcp-session-id');
                console.log('Response headers:', [...response.headers.entries()]);
                console.log('Session ID:', sessionId);
                
                if (sessionId) {
                    // Send initialized notification
                    await fetch(MCP_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json, text/event-stream',
                            'Mcp-Session-Id': sessionId
                        },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            method: 'notifications/initialized',
                            params: {}
                        })
                    });
                    
                    isConnected = true;
                    updateStatus('Connected', true);
                    appendToTerminal('system', 'Connected to Claude Code MCP Server');
                    appendToTerminal('system', 'Type your commands or questions below. Claude Code will help you with coding tasks.');
                    appendToTerminal('system', '');
                } else {
                    throw new Error('Failed to get session ID');
                }
            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('Connection Failed', false);
                appendToTerminal('error', `Failed to connect: ${error.message}`);
            }
        }

        // Send command to Claude Code
        async function sendCommand() {
            const input = document.getElementById('input');
            const command = input.value.trim();
            
            if (!command) return;
            if (!isConnected) {
                appendToTerminal('error', 'Not connected to server. Trying to reconnect...');
                await connectToServer();
                return;
            }

            // Clear input
            input.value = '';
            input.style.height = 'auto';
            
            // Show command in terminal
            appendToTerminal('user', command);
            
            // Disable send button
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            
            try {
                // Show thinking state
                const thinkingId = appendToTerminal('thinking', 'Claude is thinking...');
                
                // Determine allowed tools based on command
                let allowedTools = null;
                if (command.toLowerCase().includes('read') || command.toLowerCase().includes('analyze') || command.toLowerCase().includes('what')) {
                    allowedTools = 'Read,Grep,Glob';
                } else if (command.toLowerCase().includes('fix') || command.toLowerCase().includes('add') || command.toLowerCase().includes('modify')) {
                    allowedTools = 'Read,Edit,MultiEdit,Write,Grep';
                } else if (command.toLowerCase().includes('create') || command.toLowerCase().includes('implement')) {
                    allowedTools = 'Read,Write,Edit,MultiEdit,Bash,Grep,Glob';
                } else {
                    // Allow all tools for general commands
                    allowedTools = 'Read,Write,Edit,MultiEdit,Bash,Grep,Glob,Task,WebSearch';
                }
                
                // Call Claude Code
                const response = await fetch(MCP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json, text/event-stream',
                        'Mcp-Session-Id': sessionId
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: Date.now(),
                        method: 'tools/call',
                        params: {
                            name: 'claude_execute',
                            arguments: {
                                prompt: command,
                                working_dir: workingDir || process.cwd(),
                                allowed_tools: allowedTools
                            }
                        }
                    })
                });

                // Remove thinking message
                removeThinking(thinkingId);
                
                // Stream response for real-time output
                if (response.headers.get('content-type') === 'text/event-stream') {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let responseId = 'response-' + Date.now();
                    let responseText = '';
                    
                    // Create response element
                    const terminal = document.getElementById('terminal');
                    const entry = document.createElement('div');
                    entry.className = 'entry';
                    entry.id = responseId;
                    entry.innerHTML = '<div class="response"></div>';
                    terminal.appendChild(entry);
                    const responseDiv = entry.querySelector('.response');
                    
                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, {stream: true});
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.substring(6));
                                    if (data.result && data.result.content) {
                                        for (const item of data.result.content) {
                                            if (item.type === 'text') {
                                                responseText = item.text;
                                                // Update response in real-time
                                                responseDiv.innerHTML = formatResponse(responseText);
                                                terminal.scrollTop = terminal.scrollHeight;
                                            }
                                        }
                                    }
                                } catch (e) {
                                    // Ignore parse errors for incomplete chunks
                                }
                            }
                        }
                    }
                    
                    if (!responseText) {
                        responseDiv.textContent = 'No response from Claude Code';
                    }
                } else {
                    // Non-streaming response
                    const text = await response.text();
                    const data = JSON.parse(text);
                    if (data.result && data.result.content) {
                        appendToTerminal('response', data.result.content[0].text);
                    }
                }
                
            } catch (error) {
                console.error('Command error:', error);
                appendToTerminal('error', `Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // Append text to terminal
        function appendToTerminal(type, text) {
            const terminal = document.getElementById('terminal');
            const entry = document.createElement('div');
            entry.className = 'entry';
            
            if (type === 'user') {
                entry.innerHTML = `
                    <div class="prompt-line">
                        <span class="prompt-symbol">❯</span>
                        <span class="user-input">${escapeHtml(text)}</span>
                    </div>
                `;
            } else if (type === 'thinking') {
                const id = 'thinking-' + Date.now();
                entry.id = id;
                entry.innerHTML = `<div class="response thinking">${escapeHtml(text)}</div>`;
                terminal.appendChild(entry);
                terminal.scrollTop = terminal.scrollHeight;
                return id;
            } else if (type === 'system') {
                entry.innerHTML = `<div class="response" style="color: #569cd6;">${escapeHtml(text)}</div>`;
            } else if (type === 'error') {
                entry.innerHTML = `<div class="response error">${escapeHtml(text)}</div>`;
            } else {
                entry.innerHTML = `<div class="response">${formatResponse(text)}</div>`;
            }
            
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Remove thinking message
        function removeThinking(id) {
            const element = document.getElementById(id);
            if (element) {
                element.remove();
            }
        }

        // Format response with code blocks and tool usage
        function formatResponse(text) {
            // Parse tool usage markers
            const lines = text.split('\n');
            let formatted = [];
            let i = 0;
            
            while (i < lines.length) {
                const line = lines[i];
                
                // Check for tool usage marker
                if (line.startsWith('🔧 Using tool:')) {
                    const toolName = line.replace('🔧 Using tool:', '').trim();
                    let toolInput = '';
                    i++;
                    
                    // Collect tool input (indented JSON)
                    while (i < lines.length && (lines[i].startsWith('{') || lines[i].startsWith('  ') || lines[i].trim() === '')) {
                        if (lines[i].trim()) {
                            toolInput += escapeHtml(lines[i]) + '\n';
                        }
                        i++;
                    }
                    
                    formatted.push(`<div class="tool-use">
                        <span class="tool-name">🔧 ${escapeHtml(toolName)}</span>
                        <pre class="tool-input">${toolInput}</pre>
                    </div>`);
                    continue;
                }
                
                // Check for tool result
                if (line.startsWith('   →')) {
                    formatted.push(`<div class="tool-result">${escapeHtml(line)}</div>`);
                    i++;
                    continue;
                }
                
                // Check for final result marker
                if (line.startsWith('✅')) {
                    formatted.push(`<div style="color: #4ec9b0; margin-top: 10px;">${escapeHtml(line)}</div>`);
                    i++;
                    continue;
                }
                
                // Regular text - escape and format
                let escapedLine = escapeHtml(line);
                
                // Format code blocks
                escapedLine = escapedLine.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                    return `<div class="code-block">${code}</div>`;
                });
                
                // Format inline code
                escapedLine = escapedLine.replace(/`([^`]+)`/g, '<code style="background: #282828; padding: 2px 4px; border-radius: 3px;">$1</code>');
                
                formatted.push(escapedLine);
                i++;
            }
            
            return formatted.join('<br>');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Update connection status
        function updateStatus(text, connected) {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-dot').className = connected ? 'connected' : '';
        }

        // Update working directory
        function updateWorkingDir() {
            workingDir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            if (!workingDir) workingDir = '/home/rishabh/Desktop/dev/claude-code-mcp';
            document.getElementById('working-dir').textContent = workingDir;
        }

        // Clear terminal
        function clearTerminal() {
            document.getElementById('terminal').innerHTML = '';
            appendToTerminal('system', 'Terminal cleared');
        }

        // Handle Enter key
        document.getElementById('input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendCommand();
            }
        });

        // Auto-resize textarea
        document.getElementById('input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });
    </script>
</body>
</html>
